name: Ready
# Triggered by 'ready/*' branches pushed by 'gh tt deliver'

on:
  workflow_dispatch:
  push:
    branches:
      - "ready/**"

concurrency:
  group: ready
  cancel-in-progress: false

jobs:
  build:
    name: Ready flow, runs when a new commit is pushed to a ready branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      statuses: write # required to set commit statuses for gh insitu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up and verify runner environment
        uses: ./.github/actions/prep-runner
        with:
          verify: gh insitu run trunk-worthy

  merge-to-trunk:
    name: Merge to trunk
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write
      issues: write
      contents: write

    steps:
      - name: Verify READY_PUSHER secret
        shell: bash
        env:
          READY_PUSHER: ${{ secrets.READY_PUSHER }}
        run: |
          if [ -z "${READY_PUSHER}" ]; then
            echo "ERROR: secrets.READY_PUSHER is not configured."
            echo "Create a PAT with content:write enabled and store it as a repository (or organization) secret named READY_PUSHER."
            exit 1
          fi
          echo "READY_PUSHER is configured."

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.READY_PUSHER }} # PAT with content:write (GITHUB_TOKEN pushes do not trigger other workflows)

      - uses: devx-cafe/takt-actions/ready-to-trunk@v1
